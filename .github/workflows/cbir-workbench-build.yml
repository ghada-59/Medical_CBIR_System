name: CBIR Workbench Build

on:
  push:
    branches: [main]
    paths:
      - "cbir_api.py"
      - "src/**"
      - "frontend/**"
      - "requirements*.txt"
      - ".github/workflows/cbir-workbench-build.yml"
  pull_request:
    paths:
      - "cbir_api.py"
      - "src/**"
      - "frontend/**"
      - "requirements*.txt"
      - ".github/workflows/cbir-workbench-build.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

  python-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-react-api.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-react-api.txt
      - run: python -m compileall -q cbir_api.py src
      - run: python -c "from cbir_api import app; assert app.title == 'Medical CBIR API'; print(app.title)"
